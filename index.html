<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Biodata Maker Pro — 4000+ Unique Designs</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- html2pdf.js CDN for client-side PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS & RESET
   ============================================================ */
:root {
  --brand: #0f172a;
  --gold: #d4a853;
  --gold-grad: linear-gradient(135deg, #d4a853, #f59e0b);
  --bg: #f1f5f9;
  --surface: #fff;
  --line: #e2e8f0;
  --ink: #0f172a;
  --ink-2: #475569;
  --ink-3: #94a3b8;
  --success: #10b981;
  --sh: 0 4px 16px rgba(15, 23, 42, 0.06);
  --sh-lg: 0 20px 48px rgba(15, 23, 42, 0.12);
  --r: 12px;
  --t: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }

/* ============================================================
   HEADER
   ============================================================ */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: -0.02em;
}

.logo-mark {
  width: 34px;
  height: 34px;
  background: var(--gold-grad);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 800;
  font-size: 16px;
  box-shadow: 0 4px 12px rgba(212, 168, 83, 0.35);
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  background: #ecfdf5;
  color: #047857;
  font-size: 11px;
  font-weight: 700;
  border: 1px solid #a7f3d0;
}

/* ============================================================
   LAYOUT
   ============================================================ */
.app-main {
  display: grid;
  grid-template-columns: 420px 1fr;
  height: calc(100vh - 63px);
  overflow: hidden;
}

.editor {
  background: var(--surface);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 16px;
  scrollbar-width: thin;
}

.sec {
  border: 1px solid var(--line);
  border-radius: var(--r);
  margin-bottom: 10px;
  background: var(--surface);
  overflow: hidden;
}

.sec[open] {
  border-color: rgba(212, 168, 83, 0.5);
  box-shadow: var(--sh);
}

.sec summary {
  list-style: none;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  min-height: 52px;
}

.sec summary::-webkit-details-marker { display: none; }

.sec-body { padding: 0 16px 16px; }

.num-badge {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  background: var(--gold-grad);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
}

/* ============================================================
   FORM FIELDS
   ============================================================ */
.fld { margin-bottom: 12px; }

.fld label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.fld input, .fld textarea, .fld select {
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 11px 14px;
  font-size: 16px;
  background: var(--surface);
  outline: none;
  transition: all var(--t);
  min-height: 46px;
}

.fld input:focus, .fld select:focus, .fld textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 4px rgba(212, 168, 83, 0.15);
}

.fld textarea { min-height: 80px; resize: vertical; }

.fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ============================================================
   TEMPLATE ENGINE UI
   ============================================================ */
.tpl-controls { display: flex; gap: 8px; margin-bottom: 12px; }

.tpl-controls input, .tpl-controls select {
  flex: 1;
  padding: 8px 12px;
  font-size: 13px;
  border-radius: 8px;
  border: 1px solid var(--line);
}

.tpl-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  max-height: 400px;
  overflow-y: auto;
  padding-right: 5px;
}

.tpl-btn {
  position: relative;
  padding: 10px;
  border: 2px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-2);
  min-height: 60px;
  transition: all var(--t);
  cursor: pointer;
}

.tpl-btn:hover {
  border-color: var(--gold);
  transform: translateY(-2px);
  box-shadow: var(--sh);
}

.tpl-btn.active {
  border-color: var(--gold);
  background: linear-gradient(135deg, #fffdf8, #fdf8ec);
  color: var(--ink);
  box-shadow: 0 0 0 4px rgba(212, 168, 83, 0.12);
}

.tpl-btn.active::before {
  content: '✓';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 16px;
  height: 16px;
  background: var(--gold-grad);
  color: #fff;
  border-radius: 50%;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tpl-swatch {
  width: 100%;
  height: 24px;
  border-radius: 4px;
  margin-bottom: 6px;
  display: flex;
  overflow: hidden;
}

.tpl-swatch > div { flex: 1; }

.load-more-btn {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-weight: bold;
  color: var(--ink);
  cursor: pointer;
}

/* ============================================================
   PREVIEW
   ============================================================ */
.preview-wrap {
  background: linear-gradient(135deg, #f8fafc, #e2e8f0);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.preview-bar {
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.6);
}

.preview-scroll {
  flex: 1;
  overflow: auto;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.preview-frame-holder {
  box-shadow: var(--sh-lg);
  border-radius: 4px;
  overflow: hidden;
  background: #fff;
}

#previewFrame {
  width: 794px;
  height: 1123px;
  border: 0;
  display: block;
  transform-origin: top left;
  transition: transform 0.15s ease;
}

/* ============================================================
   FOOTER (Mobile)
   ============================================================ */
.app-footer {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.95);
  border-top: 1px solid var(--line);
  gap: 8px;
  z-index: 100;
}

.footer-btn {
  flex: 1;
  min-height: 48px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-pdf { background: var(--gold-grad); color: #fff; flex: 2; }
.btn-save { background: var(--bg); color: var(--ink); border: 1.5px solid var(--line); }

/* ============================================================
   EDUCATION UI
   ============================================================ */
.edu-mode-toggle { display: flex; gap: 10px; margin-bottom: 12px; }

.edu-row {
  border: 1px solid var(--line);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
  background: #fafafa;
}

.btn-sm {
  background: var(--line);
  color: var(--ink);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  margin-top: 5px;
}

.btn-danger {
  background: #fee2e2;
  color: #b91c1c;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  float: right;
  margin-top: -30px;
}

@media (max-width: 1023px) {
  .app-main { display: block; height: auto; padding-bottom: 90px; }
  .app-footer { display: flex; }
  .panel { display: none; }
  .panel.active { display: block; }
  .editor { padding: 12px; }
  .preview-wrap { height: 80vh; }
}
</style>
</head>
<body>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header class="app-header">
  <div class="logo">
    <div class="logo-mark">B</div>
    <span>Biodata<span style="color:var(--gold)">Pro</span></span>
  </div>
  <div class="status-pill" id="statusPill">Auto-save</div>
</header>

<!-- ============================================================
     MAIN
     ============================================================ -->
<main class="app-main">
  <!-- EDITOR PANEL -->
  <aside class="editor panel active" id="editPanel">
    <!-- Design Selection -->
    <details class="sec" open>
      <summary><span class="num-badge">1</span> Choose Design (4000+ Available)</summary>
      <div class="sec-body">
        <div class="tpl-controls">
          <input type="text" id="searchTpl" placeholder="Search design (e.g. Royal)...">
          <select id="filterLayout">
            <option value="all">All Layouts</option>
            <option value="classic">Classic</option>
            <option value="sidebar">Sidebar</option>
            <option value="banner">Banner</option>
            <option value="corporate">Corporate</option>
            <option value="cards">Cards</option>
            <option value="split">Split</option>
            <option value="minimal">Minimal</option>
            <option value="timeline">Timeline</option>
            <option value="editorial">Editorial</option>
            <option value="traditional">Traditional</option>
            <option value="magazine">Magazine</option>
            <option value="executive">Executive</option>
            <option value="vintage">Vintage</option>
          </select>
        </div>
        <div class="tpl-grid" id="templateGrid"></div>
        <button class="load-more-btn" id="loadMoreBtn">Load More Designs...</button>
      </div>
    </details>

    <!-- Photo -->
    <details class="sec" open>
      <summary><span class="num-badge">2</span> Profile Photo</summary>
      <div class="sec-body">
        <div class="fld">
          <label>Upload Photo</label>
          <input type="file" id="photoFile" accept="image/*">
        </div>
      </div>
    </details>

    <!-- Personal Details -->
    <details class="sec" open>
      <summary><span class="num-badge">3</span> Personal Details</summary>
      <div class="sec-body">
        <div class="fld" style="background:#f0fdf4; padding:10px; border-radius:10px; border:1px solid #bbf7d0; margin-bottom:15px;">
          <label style="color:#166534">🌐 PDF Output Language</label>
          <select id="language" style="border-color:#86efac; font-weight:600;">
            <option value="en">English</option>
            <option value="hi">Hindi (हिंदी)</option>
            <option value="mr">Marathi (मराठी)</option>
            <option value="gu">Gujarati (ગુજરાતી)</option>
            <option value="bn">Bengali (বাংলা)</option>
            <option value="ta">Tamil (தமிழ்)</option>
            <option value="te">Telugu (తెలుగు)</option>
            <option value="kn">Kannada (ಕನ್ನಡ)</option>
            <option value="ml">Malayalam (മലയാളം)</option>
            <option value="pa">Punjabi (ਪੰਜਾਬੀ)</option>
            <option value="or">Odia (ଓଡ଼ିଆ)</option>
          </select>
        </div>
        <div class="fld"><label>Full Name</label><input id="name" placeholder="Your Full Name"></div>
        <div class="fld-row">
          <div class="fld"><label>Date of Birth</label><input id="dob" type="date"></div>
          <div class="fld"><label>Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
        </div>
        <div class="fld-row">
          <div class="fld"><label>Height</label>
            <div style="display:flex;gap:5px;">
              <select id="height_ft" style="flex:1;"><option value="">Ft</option><option>4</option><option>5</option><option>6</option><option>7</option></select>
              <select id="height_in" style="flex:1;"><option value="">In</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option></select>
            </div>
          </div>
          <div class="fld"><label>Weight</label><input id="weight" placeholder="e.g. 70 kg"></div>
        </div>
        <div class="fld-row">
          <div class="fld"><label>Blood Group</label><input id="blood" placeholder="O+"></div>
          <div class="fld"><label>Marital Status</label><select id="marital"><option value="">Select</option><option>Unmarried</option><option>Married</option><option>Divorced</option><option>Widowed</option></select></div>
        </div>
        <div class="fld-row">
          <div class="fld"><label>Religion</label>
            <input id="religion" list="religion-list" placeholder="Type or select...">
            <datalist id="religion-list">
              <option value="Hindu"></option><option value="Muslim"></option><option value="Christian"></option><option value="Sikh"></option><option value="Buddhist"></option><option value="Jain"></option><option value="Parsi"></option>
            </datalist>
          </div>
          <div class="fld"><label>Caste</label><input id="caste" placeholder="Optional"></div>
        </div>
        <div class="fld-row">
          <div class="fld"><label>Gotra</label><input id="gotra" placeholder="Optional"></div>
          <div class="fld"><label>Rashi</label><input id="rashi" placeholder="Optional"></div>
        </div>
        <div class="fld-row">
          <div class="fld"><label>Nakshatra</label><input id="nakshatra" placeholder="Optional"></div>
          <div class="fld"><label>Manglik</label><select id="manglik"><option value="">Select</option><option>Yes</option><option>No</option></select></div>
        </div>
        <div class="fld" style="margin-top:20px;">
          <label style="display:flex; justify-content:space-between; align-items:center;">
            <span>Profile / Objective</span>
            <button type="button" id="aiGenBtn" style="background:linear-gradient(135deg,#8b5cf6,#3b82f6); color:white; border:none; padding:6px 12px; border-radius:6px; font-size:11px; font-weight:bold; cursor:pointer;">✨ AI Generate</button>
          </label>
          <textarea id="profile" placeholder="Short introduction..."></textarea>
        </div>
      </div>
    </details>

    <!-- Contact -->
    <details class="sec">
      <summary><span class="num-badge">4</span> Contact Details</summary>
      <div class="sec-body">
        <div class="fld"><label>Mobile Number</label><input id="phone" placeholder="+91 XXXXX XXXXX"></div>
        <div class="fld"><label>Email</label><input id="email" type="email" placeholder="name@example.com"></div>
        <div class="fld"><label>Address</label><textarea id="address" placeholder="Full address..."></textarea></div>
      </div>
    </details>

    <!-- Family -->
    <details class="sec">
      <summary><span class="num-badge">5</span> Family Details</summary>
      <div class="sec-body">
        <div class="fld-row">
          <div class="fld"><label>Father Name</label><input id="father" placeholder="Father name"></div>
          <div class="fld"><label>Father Occupation</label><input id="father_job" placeholder="Occupation"></div>
        </div>
        <div class="fld-row">
          <div class="fld"><label>Mother Name</label><input id="mother" placeholder="Mother name"></div>
          <div class="fld"><label>Mother Occupation</label><input id="mother_job" placeholder="Occupation"></div>
        </div>
        <div class="fld"><label>Brothers</label><textarea id="brothers" placeholder="One per line..."></textarea></div>
        <div class="fld"><label>Sisters</label><textarea id="sisters" placeholder="One per line..."></textarea></div>
      </div>
    </details>

    <!-- Education -->
    <details class="sec">
      <summary><span class="num-badge">6</span> Education</summary>
      <div class="sec-body">
        <div class="edu-mode-toggle">
          <label><input type="radio" name="edu_mode" value="detailed" checked> Detailed</label>
          <label><input type="radio" name="edu_mode" value="simple"> Simple</label>
        </div>
        <div id="edu-detailed-box">
          <div id="edu-rows-container"></div>
          <button type="button" class="btn-sm" id="addEduBtn">+ Add Education</button>
        </div>
        <div id="edu-simple-box" style="display:none;">
          <div class="fld"><label>Qualifications</label><textarea id="education_simple" placeholder="10th - 85%&#10;12th - 80%"></textarea></div>
        </div>
      </div>
    </details>

    <!-- Work & Skills -->
    <details class="sec">
      <summary><span class="num-badge">7</span> Work &amp; Skills</summary>
      <div class="sec-body">
        <div class="fld"><label>Experience</label><textarea id="experience" placeholder="2020-2023 - Company - Role"></textarea></div>
        <div class="fld"><label>Skills (Name | Level 0-100)</label><textarea id="skills" placeholder="Python | 90&#10;Communication | 85"></textarea></div>
        <div class="fld-row">
          <div class="fld"><label>Languages</label><input id="languages" placeholder="Hindi, English"></div>
          <div class="fld"><label>Hobbies</label><input id="hobbies" placeholder="Reading, Music"></div>
        </div>
      </div>
    </details>

    <!-- Declaration -->
    <details class="sec">
      <summary><span class="num-badge">8</span> Declaration</summary>
      <div class="sec-body">
        <div class="fld">
          <label>Select Preset</label>
          <select id="declarationPreset">
            <option value="">-- Choose --</option>
            <option value="I hereby declare that the information provided above is true and correct to the best of my knowledge and belief.">Standard 1</option>
            <option value="I solemnly affirm that the details furnished above are true and accurate.">Standard 2</option>
            <option value="I confirm that the above details are true and I have not concealed any material facts.">Standard 3</option>
          </select>
        </div>
        <div class="fld"><label>Declaration Text</label><textarea id="declaration"></textarea></div>
        <div class="fld-row">
          <div class="fld"><label>Place</label><input id="place" placeholder="Place"></div>
          <div class="fld"><label>Date</label><input id="date" type="date"></div>
        </div>
      </div>
    </details>
  </aside>

  <!-- PREVIEW PANEL -->
  <section class="preview-wrap panel" id="previewPanel">
    <div class="preview-bar">
      <span class="preview-label">Live Preview</span>
    </div>
    <div class="preview-scroll" id="previewScroll">
      <div class="preview-frame-holder" id="previewHolder">
        <iframe id="previewFrame"></iframe>
      </div>
    </div>
  </section>
</main>

<!-- FOOTER (Mobile) -->
<footer class="app-footer">
  <button class="footer-btn btn-save" id="saveBtn">💾 Save</button>
  <button class="footer-btn btn-pdf" id="pdfBtn">📥 Download PDF</button>
</footer>

     JAVASCRIPT ENGINE
     ============================================================ -->

/* ============================================================
   RENDER TEMPLATE GRID
   ============================================================ */
function renderTemplates(reset = false) {
  const grid = $('templateGrid');
  if (reset) { grid.innerHTML = ''; visibleCount = 20; }

  const filtered = allTemplates.filter(t => {
    const matchText = t.name.toLowerCase().includes(filterText.toLowerCase()) ||
                      t.layout.includes(filterText.toLowerCase());
    const matchLayout = filterLayout === 'all' || t.layout === filterLayout;
    return matchText && matchLayout;
  });

  grid.innerHTML = '';
  const toShow = filtered.slice(0, visibleCount);

  toShow.forEach(t => {
    const btn = document.createElement('button');
    btn.className = `tpl-btn ${currentTheme.id === t.id ? 'active' : ''}`;
    btn.innerHTML = `
      <div class="tpl-swatch">
        <div style="background:${t.primary}"></div>
        <div style="background:${t.accent}"></div>
      </div>
      ${t.name}<br>
      <small style="font-weight:400;color:#888;text-transform:capitalize">${t.layout}</small>
    `;
    btn.onclick = () => {
      document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTheme = t;
      saveDraft();
      scheduleUpdate();
    };
    grid.appendChild(btn);
  });

  $('loadMoreBtn').style.display = filtered.length > visibleCount ? 'block' : 'none';
}

$('searchTpl').addEventListener('input', (e) => { filterText = e.target.value; renderTemplates(true); });
$('filterLayout').addEventListener('change', (e) => { filterLayout = e.target.value; renderTemplates(true); });

/* ============================================================
   PREVIEW UPDATE
   ============================================================ */
let previewTimer = null;

function scheduleUpdate() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 300);
}

function injectPhotoIntoFrame(frame) {
  try {
    const doc = frame.contentDocument;
    if (!doc) return;
    const box = doc.getElementById('photoBox');
    const photo = doc.getElementById('profilePhoto');
    if (box) box.style.display = photoData ? 'block' : 'none';
    if (photo && photoData) {
      photo.src = photoData;
      photo.style.display = 'block';
    }
  } catch (e) { /* cross-origin fallback */ }
}

function updatePreview() {
  return new Promise(async (resolve) => {
    try {
      // Build HTML for preview by injecting data into a hidden template
      const html = buildTemplateHTML(collectData());
      const frame = $('previewFrame');
      frame.onload = () => { injectPhotoIntoFrame(frame); fitPreview(); resolve(); };
      frame.srcdoc = html;
    } catch (e) {
      console.error('Preview error:', e);
      resolve();
    }
  });
}

/* ============================================================
   FIT PREVIEW
   ============================================================ */
function fitPreview() {
  const scroll = $('previewScroll');
  const holder = $('previewHolder');
  const frame = $('previewFrame');
  if (!scroll || !frame) return;
  const scale = Math.min(1, (scroll.clientWidth - 40) / 794);
  frame.style.transform = `scale(${scale})`;
  holder.style.width = (794 * scale) + 'px';
  holder.style.height = (1123 * scale) + 'px';
}

/* ============================================================
   PHOTO HANDLING
   ============================================================ */
$('photoFile').onchange = (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 600;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        const r = Math.min(MAX / w, MAX / h);
        w = Math.round(w * r);
        h = Math.round(h * r);
      }
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      photoData = canvas.toDataURL('image/jpeg', 0.85);
      scheduleUpdate();
      saveDraft();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
};

/* ============================================================
   SAVE / RESTORE DRAFT
   ============================================================ */
function saveDraft() {
  try {
    const draft = {
      theme: currentTheme,
      photo: photoData,
      values: {},
      eduMode: document.querySelector('input[name="edu_mode"]:checked').value,
      eduData: eduData
    };
    FIELDS.forEach(id => { draft.values[id] = $(id)?.value || ''; });
    draft.values.height_ft = $('height_ft').value;
    draft.values.height_in = $('height_in').value;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(draft));
    $('statusPill').textContent = '✓ Saved';
    setTimeout(() => $('statusPill').textContent = 'Auto-save', 1500);
  } catch (e) { /* ignore quota errors */ }
}

function restoreDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const draft = JSON.parse(raw);

    if (draft.values) {
      FIELDS.forEach(id => { if ($(id)) $(id).value = draft.values[id] || ''; });
      $('height_ft').value = draft.values.height_ft || '';
      $('height_in').value = draft.values.height_in || '';
    }

    if (draft.eduMode) {
      document.querySelector(`input[name="edu_mode"][value="${draft.eduMode}"]`).checked = true;
      $('edu-detailed-box').style.display = draft.eduMode === 'detailed' ? 'block' : 'none';
      $('edu-simple-box').style.display = draft.eduMode === 'simple' ? 'block' : 'none';
    }

    if (draft.eduData) draft.eduData.forEach(r => addEduRow(r));

    if (draft.theme) {
      currentTheme = draft.theme;
      document.querySelectorAll('.tpl-btn').forEach(b =>
        b.classList.toggle('active', b.innerHTML.includes(draft.theme.name))
      );
    }

    if (draft.photo) photoData = draft.photo;
  } catch (e) { /* ignore corrupted data */ }
}

$('saveBtn').onclick = saveDraft;

/* ============================================================
   PDF DOWNLOAD (Client-Side using html2pdf.js)
   ============================================================ */
async function downloadPDF() {
  const btn = $('pdfBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Generating...';

  try {
    // Build the final HTML (same as preview)
    const html = buildTemplateHTML(collectData());

    // Create a hidden container
    const container = document.createElement('div');
    container.style.position = 'fixed';
    container.style.left = '-9999px';
    container.style.top = '0';
    container.style.width = '210mm';
    container.innerHTML = html;
    document.body.appendChild(container);

    // Use html2pdf.js
    const element = container.querySelector('.page');
    const opt = {
      margin: 0,
      filename: ($('name').value || 'Biodata') + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, letterRendering: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    await html2pdf().set(opt).from(element).save();

    document.body.removeChild(container);
    btn.textContent = '✓ Done';
    setTimeout(() => btn.textContent = '📥 Download PDF', 2000);
  } catch (e) {
    console.error('PDF error:', e);
    alert('PDF generation failed. Please try again.');
    btn.textContent = '📥 Download PDF';
  } finally {
    btn.disabled = false;
  }
}

$('pdfBtn').onclick = downloadPDF;

          <div class="skill">
            <div class="skill-name">${s.name}</div>
            <div class="track"><div class="fill" style="width:${s.level}%"></div></div>
            <div class="skill-pct">${s.level}%</div>
          </div>
        `).join('')}
      </section>
    `);
  }

  if (data.languages || data.hobbies) {
    sidebarSections.push(`
      <section class="section">
        <h2 class="section-title"><span class="mark">5.</span> ${labels.additional}</h2>
        <div class="grid">
          ${data.languages ? `<div class="label">${labels.languages}</div><div class="value">${data.languages}</div>` : ''}
          ${data.hobbies ? `<div class="label">${labels.hobbies}</div><div class="value">${data.hobbies}</div>` : ''}
        </div>
      </section>
    `);
  }

  // Main: profile, education, experience, declaration
  if (data.profile) {
    mainSections.push(`
      <section class="section">
        <h2 class="section-title"><span class="mark">6.</span> ${labels.profile}</h2>
        <div class="block">${data.profile}</div>
      </section>
    `);
  }

  if (eduHTML) {
    mainSections.push(`
      <section class="section">
        <h2 class="section-title"><span class="mark">7.</span> ${labels.education}</h2>
        <div style="padding:0 2mm;">${eduHTML}</div>
      </section>
    `);
  }

  if (data.experience) {
    mainSections.push(`
      <section class="section">
        <h2 class="section-title"><span class="mark">8.</span> ${labels.experience}</h2>
        <div class="block">${data.experience}</div>
      </section>
    `);
  }

  if (data.declaration) {
    mainSections.push(`
      <section class="section">
        <h2 class="section-title"><span class="mark">9.</span> ${labels.declaration}</h2>
        <div class="block">${data.declaration}</div>
      </section>
    `);
  }

  // Build final HTML
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${data.name || 'Biodata'}</title>
${t.fontUrl ? `<link href="${t.fontUrl}" rel="stylesheet">` : ''}
<style>
:root {
  --primary: ${t.primary};
  --accent: ${t.accent};
  --tint: ${t.tint};
  --ink: ${t.ink};
  --muted: ${t.ink}99;
  --track: ${t.tint};
  --display: '${t.displayFont}', serif;
  --body: '${t.bodyFont}', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e9edf2;color:var(--ink);font-family:var(--body);font-size:10pt;line-height:1.45}
@page{size:A4;margin:0}
.page{
  width:210mm;min-height:297mm;margin:0 auto;background:#fff;position:relative;
  padding:11mm 14mm 12mm;overflow:visible;
}
.page:before{
  content:"";position:absolute;inset:5mm;border:1.2px solid var(--accent);
  pointer-events:none;opacity:.6;
}
.page:after{
  content:"";position:absolute;inset:8mm;border:.45px solid var(--accent);
  pointer-events:none;opacity:.25;
}
.content{position:relative;z-index:1}

/* HEADER */
.header{
  position:relative;text-align:center;padding:1mm 4mm 5mm;
  border-bottom:1.5px solid var(--accent);min-height:0;
}
.ornament{color:var(--accent);font-size:15pt;letter-spacing:7px;margin-bottom:2mm}
.photo{
  width:34mm;height:40mm;margin:0 auto 3mm;padding:1.2mm;
  border:2px solid var(--accent);
  border-radius:${isRound ? '50%' : '3mm'};
  background:#fff;box-shadow:0 2mm 5mm #00000018;overflow:hidden;
}
.photo img{
  width:100%;height:100%;object-fit:cover;
  border-radius:${isRound ? '50%' : '1.5mm'};display:block;
}
.name{
  font-family:var(--display);font-size:27pt;line-height:1.12;
  color:var(--primary);font-weight:800;letter-spacing:.4px;
  overflow-wrap:anywhere;margin:0;
}
.contact-line{
  margin-top:2mm;color:var(--muted);font-size:8.5pt;overflow-wrap:anywhere;
}

/* BODY */
.resume-body{display:block}
.side-column,.main-column{min-width:0}
.section{margin-top:5mm;break-inside:auto}
.section-title{
  display:flex;align-items:center;gap:2mm;margin:0 0 2.5mm;
  color:var(--primary);font-family:var(--display);font-size:12pt;
  font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
}
.section-title:after{
  content:"";height:1px;flex:1;
  background:linear-gradient(90deg,var(--accent),transparent);
}
.section-title .mark{color:var(--accent);font-size:11pt;font-weight:800;min-width:15px;text-align:left}

/* GRID */
.grid{display:grid;grid-template-columns:38mm 1fr;gap:1.7mm 3mm;padding:0 2mm}
.label{font-size:8.5pt;color:var(--muted);font-weight:700}
.value{font-size:9.5pt;color:var(--ink);font-weight:500;white-space:pre-line;overflow-wrap:anywhere}
.block{padding:0 2mm;white-space:pre-line;text-align:justify;overflow-wrap:anywhere}

/* SKILLS */
.skill{display:grid;grid-template-columns:38mm 1fr 10mm;gap:3mm;align-items:center;margin:2mm 2mm}
.skill-name{font-size:9pt;font-weight:700}
.track{height:2.2mm;background:var(--track);border-radius:10mm;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:10mm}
.skill-pct{font-size:8pt;color:var(--muted);text-align:right}

/* FOOTER */
.footer{
  margin-top:8mm;padding-top:3mm;border-top:1px solid var(--accent);
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:10mm;color:var(--muted);font-size:8.5pt;break-inside:avoid;
}
.signature{text-align:center;min-width:42mm}
.signature-line{height:10mm;border-bottom:1px solid var(--muted);margin-bottom:1.5mm}
.signature-label{text-transform:uppercase;letter-spacing:1px;font-weight:700;font-size:8pt}

/* EDUCATION */
.edu-item{margin-bottom:3mm;padding-bottom:2mm;border-bottom:1px dashed var(--track)}
.edu-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.edu-header{display:flex;justify-content:space-between;font-weight:700;font-size:10pt;color:var(--primary);margin-bottom:1mm}
.edu-sub{font-size:9pt;color:var(--ink);margin-bottom:.5mm}
.edu-meta{font-size:8.5pt;color:var(--muted);display:flex;gap:4mm}

/* ============================================================
   LAYOUT-SPECIFIC OVERRIDES
   ============================================================ */

/* SIDEBAR */
.layout-sidebar .resume-body{display:grid;grid-template-columns:62mm minmax(0,1fr);gap:7mm;margin-top:4mm}
.layout-sidebar .side-column{
  background:var(--primary);color:#fff;padding:5mm 4mm;border-radius:2mm;align-self:start;
}
.layout-sidebar .side-column .section{margin-top:5mm}
.layout-sidebar .side-column .section-title{color:#fff;font-size:10pt}
.layout-sidebar .side-column .section-title:after{background:var(--accent)}
.layout-sidebar .side-column .label,
.layout-sidebar .side-column .value,
.layout-sidebar .side-column .skill-name,
.layout-sidebar .side-column .skill-pct{color:#fff}
.layout-sidebar .side-column .grid{grid-template-columns:1fr;gap:1mm}
.layout-sidebar .side-column .track{background:#ffffff55}
.layout-sidebar .side-column .fill{background:var(--accent)}
.layout-sidebar .side-column .skill{
  grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:1mm 2mm;
}
.layout-sidebar .side-column .skill-name{grid-column:1 / -1;font-size:8.5pt}
.layout-sidebar .side-column .track{grid-column:1;height:1.8mm}
.layout-sidebar .side-column .skill-pct{font-size:7.5pt}
.layout-sidebar .header{text-align:left;padding-left:5mm;border:0;min-height:0}
.layout-sidebar .header .photo{float:left;margin:0 6mm 2mm 0}
.layout-sidebar .header .ornament{display:none}
.layout-sidebar .header .name{padding-top:2mm}

/* BANNER */
.layout-banner .header{
  background:var(--primary);color:white;border:0;border-radius:2mm;padding:6mm 6mm;
}
.layout-banner .name{color:white}
.layout-banner .contact-line{color:#fff;opacity:.9}
.layout-banner .ornament{color:var(--accent)}
.layout-banner .section-title{background:var(--tint);padding:2mm 3mm;border-radius:1mm}

/* CORPORATE */
.layout-corporate .header{
  text-align:left;padding:2mm 5mm 4mm 7mm;border-left:4mm solid var(--accent);min-height:0;
}
.layout-corporate .photo{float:right;margin:0 0 2mm 7mm}
.layout-corporate .ornament{display:none}
.layout-corporate .name{padding-top:0}
.layout-corporate .contact-line{max-width:125mm}
.layout-corporate .section-title{
  font-family:var(--body);font-size:11pt;letter-spacing:1.5px;
  border-bottom:1px solid var(--accent);padding-bottom:1mm;
}

/* CARDS */
.layout-cards .section{
  background:#fff;padding:4mm;border:1px solid var(--track);
  border-radius:3mm;box-shadow:0 1mm 3mm #0000000b;
}
.layout-cards .section-title{margin-bottom:3mm}
.layout-cards .header{
  border:0;margin-bottom:3mm;
  background:linear-gradient(135deg,var(--tint),#fff);border-radius:4mm;
}
.layout-cards .photo{border-radius:50%}
.page.layout-cards{background:var(--tint)}

/* SPLIT */
.layout-split .header{
  background:var(--primary);color:white;text-align:left;padding:6mm 7mm;
  border-radius:3mm 3mm 0 0;
}
.layout-split .name{color:white}
.layout-split .contact-line{color:#fff}
.layout-split .photo{float:right;margin:0 0 2mm 8mm}
.layout-split .ornament{display:none}
.layout-split .section-title{border-bottom:2px solid var(--accent);padding-bottom:1.5mm}

/* MINIMAL */
.layout-minimal .page:before,
.layout-minimal .page:after{display:none}
.layout-minimal .header{border-bottom:2px solid var(--primary);text-align:left;padding-left:0}
.layout-minimal .ornament{display:none}
.layout-minimal .photo{float:right;margin:0 0 2mm 8mm;border:1px solid var(--accent);box-shadow:none}
.layout-minimal .name{padding-top:2mm}
.layout-minimal .section-title{font-family:var(--body);font-size:10pt;letter-spacing:1.8px}
.layout-minimal .section-title:after{background:var(--primary);opacity:.35}

/* TIMELINE */
.layout-timeline .section{border-left:2px solid var(--accent);margin-left:3mm;padding-left:5mm}
.layout-timeline .section-title{position:relative}
.layout-timeline .section-title:before{
  content:"";position:absolute;left:-7.2mm;width:3mm;height:3mm;
  background:var(--primary);border:1px solid #fff;border-radius:50%;
}
.layout-timeline .header{border-bottom:3px solid var(--primary)}
.layout-timeline .ornament{letter-spacing:10px}

/* EDITORIAL */
.layout-editorial .header{text-align:left;padding:3mm 5mm 6mm;border-bottom:0}
.layout-editorial .header:after{
  content:"";position:absolute;left:0;bottom:0;width:45mm;height:3px;background:var(--accent);
}
.layout-editorial .photo{float:right;margin:0 0 2mm 8mm;border-radius:1mm}
.layout-editorial .ornament{display:none}
.layout-editorial .name{font-size:30pt}
.layout-editorial .section-title{font-family:var(--body);font-size:10pt;letter-spacing:2px}
.layout-editorial .section{margin-top:7mm}

/* TRADITIONAL */
.layout-traditional .header{padding-top:2mm;border-bottom:3px double var(--accent)}
.layout-traditional .ornament{font-size:19pt}
.layout-traditional .name{text-transform:uppercase;letter-spacing:1.3px}
.layout-traditional .section-title{border-bottom:1px solid var(--accent);padding-bottom:1.5mm}

/* MAGAZINE */
.layout-magazine .header{
  display:flex;align-items:flex-end;justify-content:space-between;
  text-align:left;padding-bottom:2mm;border-bottom:4px solid var(--primary);
}
.layout-magazine .header .header-copy{flex:1}
.layout-magazine .photo{
  width:28mm;height:34mm;margin:0 0 0 5mm;border:none;box-shadow:none;border-radius:0;padding:0;
}
.layout-magazine .name{font-size:32pt;line-height:.9}
.layout-magazine .ornament{display:none}
.layout-magazine .resume-body{columns:2;column-gap:8mm}
.layout-magazine .section{break-inside:avoid}

/* EXECUTIVE */
.layout-executive .header{
  background:var(--tint);color:var(--primary);padding:5mm 6mm;
  border-bottom:2px solid var(--primary);border-radius:0;
}
.layout-executive .name{color:var(--primary);font-size:24pt}
.layout-executive .photo{float:right;margin:0 0 2mm 6mm;width:30mm;height:36mm}
.layout-executive .section-title{
  background:var(--primary);color:#fff;padding:1.5mm 3mm;font-size:10pt;
}
.layout-executive .section-title:after{display:none}

/* VINTAGE */
.layout-vintage .page{background:#FCFBF5}
.layout-vintage .page:before{border:3px double var(--primary);inset:3mm;opacity:1}
.layout-vintage .page:after{border:1px solid var(--primary);inset:4mm;opacity:.6}
.layout-vintage .header{border-bottom:1px solid var(--primary)}
.layout-vintage .name{font-family:'Libre Baskerville',serif;font-size:24pt}
.layout-vintage .photo{border-radius:0;border:1px solid var(--primary);padding:1mm}
.layout-vintage .photo img{border-radius:0}
.layout-vintage .section-title{
  font-family:'Libre Baskerville',serif;text-transform:none;
  border-bottom:1px dashed var(--primary);padding-bottom:1mm;
}
.layout-vintage .section-title:after{display:none}

/* PRINT */
@media print{
  html,body{background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page{width:210mm;min-height:0;margin:0;padding:11mm 14mm 12mm;overflow:visible;box-shadow:none}
  .page:before,.page:after{position:fixed;inset:5mm}
  .page:after{inset:8mm}
  .header,.section-title,.grid,.skill,.footer,.photo,.edu-item{break-inside:avoid;page-break-inside:avoid}
  .section{break-inside:auto;page-break-inside:auto}
  .section-title{break-after:avoid;page-break-after:avoid}
  .block,.value{orphans:3;widows:3}
}
@media screen{body{padding:12px 0}.page{box-shadow:0 10px 40px #15223822}}
</style>
</head>
<body>
<div class="page layout-${layout}">
<main class="content">
<header class="header">
  <div class="ornament">✦ ❖ ✦</div>
  ${photoHTML}
  <div class="header-copy">
    <h1 class="name">${data.name || 'YOUR NAME'}</h1>
    ${data.phone || data.email ? `<div class="contact-line">${data.phone || ''}${data.phone && data.email ? ' &nbsp; • &nbsp; ' : ''}${data.email || ''}</div>` : ''}
  </div>
</header>

<div class="resume-body">
  <aside class="side-column">
    ${sidebarSections.join('')}
  </aside>
  <div class="main-column">
    ${mainSections.join('')}
  </div>
</div>

<footer class="footer">
  <div>
    ${data.place ? `${labels.place}: ${data.place}` : ''}
    ${data.place && data.date ? '<br>' : ''}
    ${data.date ? `${labels.dob}: ${data.date}` : ''}
  </div>
  <div class="signature">
    <div class="signature-line"></div>
    <div class="signature-label">${labels.signature}</div>
  </div>
</footer>
</main>
</div>
</body>
</html>`;
}

updatePreview();
