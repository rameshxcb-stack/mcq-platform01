name: Biodata Maker Preview Server

on:
  workflow_dispatch:
  schedule:
    # Har 6 ghante mein trigger hoga
    - cron: "0 */6 * * *"

permissions:
  contents: read

# 🔥 QUEUE SYSTEM (Yahan hai asli magic)
# Agar pehla run chal raha hai, toh naya run cancel nahi hoga, balki queue mein wait karega.
# Jaise hi pehla run khatam hoga, yeh turant start ho jayega. (Zero Downtime)
concurrency:
  group: biodata-server-queue
  cancel-in-progress: false

jobs:
  serve:
    runs-on: ubuntu-latest
    # GitHub Actions ka maximum limit 360 minutes (6 hours) hota hai
    timeout-minutes: 360
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            libffi-dev shared-mime-info fonts-liberation fonts-dejavu

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Fallback check
          if ! python -c "import weasyprint"; then
            echo "::warning::WeasyPrint install failed — fallback to client-side PDF."
          fi

      - name: Install Cloudflare Quick Tunnel
        run: |
          curl -L --fail -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Flask
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          nohup python app.py >/tmp/flask.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null; then
              echo "Flask is up."; break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:5000/api/health || { echo "Flask failed:"; cat /tmp/flask.log; exit 1; }

      - name: Start Cloudflare Quick Tunnel
        id: tunnel
        run: |
          nohup cloudflared tunnel --url http://localhost:5000 --no-autoupdate >/tmp/tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Tunnel failed to start:"; cat /tmp/tunnel.log; exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify public URL
        run: |
          URL="${{ steps.tunnel.outputs.url }}"
          for i in $(seq 1 20); do
            if curl -sf "$URL/api/health" >/dev/null; then
              echo "✅ Public URL is healthy: $URL"; exit 0
            fi
            sleep 3
          done
          echo "❌ Tunnel URL is not reachable."
          exit 1

      - name: Publish URL in run summary
        run: |
          URL="${{ steps.tunnel.outputs.url }}"
          {
            echo "## 🌐 Biodata Maker is live"
            echo ""
            echo "**URL:** $URL"
            echo ""
            echo "⏱️ Alive until this job ends (~6 h). Next run is queued automatically."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep server alive (Queue tak zinda rakhega)
        # 360 minutes ka limit hai, hum 357 minutes (21420 seconds) sleep karayenge
        # Taaki timeout hone se pehle hi naya queued run aas paas start ho jaye
        run: sleep 21420

      - name: Cleanup
        if: always()
        run: |
          pkill -f cloudflared || true
          pkill -f "python app.py" || true
