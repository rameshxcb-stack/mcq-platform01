## Per-theme fonts
Each template auto-selects a display + body font pair based on its mood:
  Professional → Oswald / Inter
  Traditional  → Libre Baskerville / Lato
  Elegant      → Playfair Display / Lato
  Premium      → Cinzel / Lato
  Modern       → Montserrat / Inter
  Creative     → Playfair Display / Poppins
  Fresh        → Montserrat / Nunito Sans
  Luxury       → Cormorant Garamond / Nunito Sans
  Classic      → Libre Baskerville / Source Sans 3
  Royal        → Cinzel / Lato
  Bold         → Oswald / Roboto
  Minimal      → DM Sans / Inter

## GitHub Actions deployment (optional demo)
The workflow starts Flask, exposes it through a Cloudflare Quick Tunnel, and
prints the public URL in the run summary. Keep in mind:

- Public repo only. Private-repo minutes run out in ~1 day at this duty cycle.
- URL changes every 6 hours. Each cron run creates a new *.trycloudflare.com URL.
  Bookmark the Actions tab and copy the latest URL from the step summary.
- Not for production. Quick Tunnels are ephemeral and rate-limited. Use a
  stable host (Render / Railway / Fly.io / a small VPS) if you need a
  permanent URL.
- WeasyPrint is optional. If it fails to install, /api/pdf returns 503 and the
  client falls back to html2canvas + jsPDF (multi-page aware).

## What was fixed in this release
- Palette misalignment in 12 templates corrected:
    royal_banner         → real deep maroon (#6B0F1A) + gold (#D4A853)
    graphite_corporate   → real graphite grey
    peach_cards          → real peach
    denim_split          → real denim blue
    lilac_minimal        → real lilac
    bronze_timeline      → real bronze
    jade_editorial       → real jade green
    maroon_sidebar       → real maroon
    turquoise_banner     → real turquoise
    smoke_corporate      → real smoke grey
    (plus minor fixes to peach/pink tone continuity)
- color-mix() removed everywhere → WeasyPrint + html2canvas now render skill
  tracks and card tints correctly. Pre-computed --track / --title-tint per theme.
- .layout-cards .page selector fixed → .page.layout-cards (card backgrounds now
  actually render).
- Sidebar skill bars no longer squeezed: stacked layout (name → bar → percent).
- Per-theme display + body fonts restored (was DM Sans everywhere).
- Hardcoded hex colors in theme overrides replaced with var(--primary) / var(--accent).
- Subtitle uses theme mood (Professional Resume / {Mood} Biodata) — consistent
  for professional and steel aliases.
- app.py VALID_THEMES includes all 56 base names + 40 aliases = 96 keys.
- index.html shows all 56 swatches with their correct palette preview.
- Client PDF is multi-page: tall content sliced into A4 pages.
- Download filenames sanitized (works with /, ?, <, > in names).
- Fonts inside the preview iframe are awaited before html2canvas capture.
- GitHub Actions: sleep shortened to fit inside timeout-minutes so cleanup runs;
  Python deps split so a WeasyPrint failure doesn't kill the job; tunnel
  health-check added; public-repo / ephemeral-URL warnings documented.
- Mobile print boundary: page decorations hidden below 700 px.
