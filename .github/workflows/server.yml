# ─────────────────────────────────────────────────────────────────────────────
#  Biodata Maker Pro — GitHub Actions + Cloudflare Quick Tunnel
#
#  ⚠️  Use this ONLY with a PUBLIC repository.
#      Private repos consume GitHub Actions minutes fast:
#      350 min × 4 runs/day × 30 days ≈ 42,000 min/month
#      (Free tier for private repos = 2,000 min/month → exhausted in ~1 day).
#
#  ℹ️  Each job produces a NEW Cloudflare tunnel URL. Copy it from the
#      workflow run summary. The URL dies when the job ends (after ~6 h).
#      The next scheduled run (every 6 h) starts a fresh tunnel.
# ─────────────────────────────────────────────────────────────────────────────
name: Biodata Maker Preview Server

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 \
            libffi-dev shared-mime-info fonts-liberation fonts-dejavu

      - name: Install Python dependencies (tolerant of WeasyPrint failure)
        run: |
          pip install --upgrade pip
          pip install Flask==3.0.3 Jinja2==3.1.4 gunicorn==22.0.0
          if ! pip install WeasyPrint==62.3; then
            echo "::warning::WeasyPrint install failed — server-side PDF will 503 and client-side fallback will be used."
          fi

      - name: Install Cloudflare Quick Tunnel
        run: |
          curl -L --fail -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Flask
        run: |
          nohup python app.py >/tmp/flask.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health >/dev/null; then
              echo "Flask is up."; break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:5000/api/health || { echo "Flask failed:"; cat /tmp/flask.log; exit 1; }

      - name: Start Cloudflare Quick Tunnel
        id: tunnel
        run: |
          nohup cloudflared tunnel --url http://localhost:5000 --no-autoupdate >/tmp/tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Tunnel failed to start:"; cat /tmp/tunnel.log; exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "URL=$URL"

      - name: Verify public URL responds
        run: |
          URL="${{ steps.tunnel.outputs.url }}"
          for i in $(seq 1 20); do
            if curl -sf "$URL/api/health" >/dev/null; then
              echo "✅ Public URL is healthy: $URL"; exit 0
            fi
            sleep 3
          done
          echo "❌ Tunnel URL is not reachable (Cloudflare may still be warming up)."
          curl -v "$URL/api/health" || true
          exit 1

      - name: Publish URL in run summary
        run: |
          URL="${{ steps.tunnel.outputs.url }}"
          {
            echo "## 🌐 Biodata Maker is live"
            echo ""
            echo "**URL:** $URL"
            echo ""
            echo "⏱️ This URL stays alive until this job ends (~6 h from start)."
            echo "📅 The next scheduled run will publish a fresh URL — check this page again."
            echo ""
            echo "🧾 Health check: \`$URL/api/health\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep server alive (≈ 342 min)
        run: sleep 20500

      - name: Cleanup
        if: always()
        run: |
          pkill -f cloudflared || true
          pkill -f "python app.py" || true
