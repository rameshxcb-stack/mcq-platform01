# Biodata Maker Pro — 56 Unique Templates

## Files
- index.html                    — responsive editor, 56 template swatches,
                                  live preview, client PDF fallback (multi-page).
- app.py                        — Flask preview + PDF API (56 base + 40 alias themes).
- pdf_template.html             — 56 unique templates across 10 layout families:
                                  classic, traditional, sidebar, banner, corporate,
                                  cards, split, minimal, timeline, editorial.
- requirements.txt              — Python dependencies.
- .github/workflows/server.yml  — optional GitHub Actions + Cloudflare Quick Tunnel.

## Run locally
    python -m pip install -r requirements.txt
    python app.py
Open http://127.0.0.1:5000

